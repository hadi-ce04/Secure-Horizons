[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentgate"
version = "0.1.0"
description = "Statistical release gate for LLM agent configurations with a signed audit ledger."
requires-python = ">=3.10"
dependencies = [
    "pyyaml==6.0.3",
    "cryptography==50.0.2",
    "streamlit==1.65.0",
    "click==8.5.0",
    "jinja2==3.1.6",
    "requests==2.34.2",
    "ollama==0.6.3",
    "altair==6.3.0",
    "pandas==3.0.6",
]

[project.scripts]
agentgate = "cli:main"

[tool.setuptools]
py-modules = ["cli"]
packages = ["agent", "attacks", "gate", "ledger", "evidence", "monitor", "dashboard"]
